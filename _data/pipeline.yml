# Projects in the pipeline, shown on the Working Papers page.
# `stage` must be one of the keys in `stages` below; the bar fills up to it.
# Edit `now` to describe what is happening at the moment.

stages:
  - key: conception
    label: Conception
  - key: data
    label: Data collection
  - key: analysis
    label: Analysis
  - key: drafting
    label: Drafting
  - key: revising
    label: Revising after review
  - key: review
    label: Under review
  - key: rr
    label: Revise & resubmit

projects:
  - title: "The Color of Activity Space: Redlining and the Racial Segregation of Everyday Places"
    authors: Wenhao Jiang and Yongjun Zhang (equal authorship)
    stage: rr
    now: Revised manuscript resubmitted to Demography.

  - title: "The Growing Geographic Affinity Between High- and Low-Paying Occupations"
    authors: Wenhao Jiang and Siwei Cheng (equal authorship)
    stage: revising
    now: Revising after a journal rejection for submission elsewhere.

  - title: "Bad Health, Bad Jobs, But for Whom? Health Status, Gender, and Sorting Into Precarious Work"
    authors: Linsey Edwards and Wenhao Jiang (equal authorship)
    stage: revising
    now: Revising after a journal rejection for submission elsewhere.

  - title: "Economic Crisis and the Discipline of Work Time"
    authors: Wenhao Jiang
    stage: drafting
